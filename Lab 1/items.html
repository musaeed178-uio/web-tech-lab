<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Items - COMSATS Lost & Found</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="header-top">
        <div class="logo"><img src="img/images.jfif" alt="COMSATS" class="logo-img" width="32" height="32"> Lost<span>&</span>Found</div>
        <div class="header-right">
            <button class="btn-nav" onclick="document.getElementById('admin-login-modal').classList.add('active')">Admin Login</button>
            <button class="menu-toggle" onclick="toggleMenu()">&#9776;</button>
        </div>
    </div>
    <nav>
        <ul id="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="report.html">Report Item</a></li>
            <li><a href="items.html" class="active">Browse Items</a></li>
        </ul>
    </nav>
</header>

<div class="container">
    <div class="section-header">
        <h2>Browse Items</h2>
        <p>Search and filter through all reported lost and found items.</p>
    </div>

    <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search by title, name, roll number..." oninput="filterItems()">
        <select id="filter-type" onchange="filterItems()">
            <option value="">All Types</option>
            <option value="lost">Lost</option>
            <option value="found">Found</option>
        </select>
        <select id="filter-status" onchange="filterItems()">
            <option value="">All Status</option>
            <option value="open">Open</option>
            <option value="resolved">Resolved</option>
        </select>
    </div>

    <div id="items-list" class="cards-grid"></div>
    <div id="no-items" class="empty-state" style="display:none;"><p>No items match your search.</p></div>
</div>

<footer>
    <p>&copy; 2026 COMSATS Lost & Found Portal. All rights reserved.</p>
</footer>

<div id="admin-login-modal" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3>Admin Login</h3>
            <button class="modal-close" onclick="closeModal('admin-login-modal')">&times;</button>
        </div>
        <div class="modal-body">
            <form onsubmit="return handleAdminLogin(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="admin-user" placeholder="Enter admin username">
                    <div class="form-error">Username is required.</div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="admin-pass" placeholder="Enter admin password">
                    <div class="form-error">Password is required.</div>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
            </form>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
    function filterItems() {
        var search = document.getElementById("search-input").value.toLowerCase();
        var type = document.getElementById("filter-type").value;
        var status = document.getElementById("filter-status").value;
        var items = getItems();

        var filtered = items.filter(function(item) {
            var matchSearch = !search ||
                item.title.toLowerCase().indexOf(search) !== -1 ||
                item.name.toLowerCase().indexOf(search) !== -1 ||
                item.roll.toLowerCase().indexOf(search) !== -1 ||
                item.description.toLowerCase().indexOf(search) !== -1;
            var matchType = !type || item.type === type;
            var matchStatus = !status || item.status === status;
            return matchSearch && matchType && matchStatus;
        });

        if (filtered.length === 0) {
            document.getElementById("items-list").innerHTML = "";
            document.getElementById("no-items").style.display = "block";
        } else {
            document.getElementById("no-items").style.display = "none";
            renderItemCards("items-list", filtered);
        }
    }

    // Initial load
    filterItems();
</script>
</body>
</html>
