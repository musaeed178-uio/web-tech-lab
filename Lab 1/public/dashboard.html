<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - COMSATS Lost & Found</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            COMSATS Lost & Found
        </div>
        <div class="nav-links">
            <span class="nav-user" id="user-display"></span>
            <button class="theme-toggle-inline btn-icon" onclick="toggleTheme()" title="Toggle theme">
                <span id="theme-icon">&#9790;</span>
            </button>
            <a href="/dashboard" class="btn btn-sm btn-secondary">Dashboard</a>
            <a href="/" class="btn btn-sm btn-secondary" onclick="handleLogout()">Sign Out</a>
        </div>
    </nav>

    <div class="main-content">
        <!-- Report Form -->
        <div class="card">
            <div class="card-header">
                <h2>Report an Item</h2>
            </div>
            <form onsubmit="reportItem(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>Item Title *</label>
                        <input type="text" id="item-title" placeholder="e.g., Blue Backpack, iPhone 14" required>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="item-category">
                            <option value="electronics">Electronics</option>
                            <option value="bags">Bags & Purses</option>
                            <option value="documents">Documents & IDs</option>
                            <option value="clothing">Clothing & Accessories</option>
                            <option value="keys">Keys</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="item-description" placeholder="Describe the item (color, brand, distinguishing features...)" rows="2"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Location Found/Lost</label>
                        <input type="text" id="item-location" placeholder="e.g., Library, C-Block, Cafeteria">
                    </div>
                    <div class="form-group">
                        <label>Status *</label>
                        <select id="item-status" required>
                            <option value="lost">I Lost This</option>
                            <option value="found">I Found This</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="width: auto;">Submit Report</button>
            </form>
        </div>

        <!-- Search & Filter -->
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search items by title, description, or location..." oninput="searchItems()">
            <select id="filter-status" onchange="searchItems()">
                <option value="">All Status</option>
                <option value="lost">Lost</option>
                <option value="found">Found</option>
            </select>
            <select id="filter-category" onchange="searchItems()">
                <option value="">All Categories</option>
                <option value="electronics">Electronics</option>
                <option value="bags">Bags</option>
                <option value="documents">Documents</option>
                <option value="clothing">Clothing</option>
                <option value="keys">Keys</option>
                <option value="other">Other</option>
            </select>
        </div>

        <!-- Items List -->
        <div class="card">
            <div class="card-header">
                <h2>Recent Reports</h2>
            </div>
            <div id="items-list" class="items-grid"></div>
            <p id="no-items" class="no-items" style="display:none;">No items match your search criteria.</p>
        </div>
    </div>

    <!-- Report Item Modal -->
    <div id="report-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Edit Report</h3>
                <button class="modal-close" onclick="closeModal('report-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <form onsubmit="updateItem(event)">
                    <input type="hidden" id="edit-id">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="edit-title" required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="edit-description" rows="2"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Category</label>
                            <select id="edit-category">
                                <option value="electronics">Electronics</option>
                                <option value="bags">Bags & Purses</option>
                                <option value="documents">Documents & IDs</option>
                                <option value="clothing">Clothing & Accessories</option>
                                <option value="keys">Keys</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Status</label>
                            <select id="edit-status">
                                <option value="lost">Lost</option>
                                <option value="found">Found</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" id="edit-location">
                    </div>
                    <div class="modal-footer" style="padding:0; border:none; margin-top:16px;">
                        <button type="button" class="btn btn-secondary" onclick="closeModal('report-modal')">Cancel</button>
                        <button type="submit" class="btn btn-primary" style="width:auto;">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Claim Modal -->
    <div id="claim-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Claim This Item</h3>
                <button class="modal-close" onclick="closeModal('claim-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <p style="font-size:14px; color:var(--text-secondary); margin-bottom:16px;">
                    Provide proof of ownership. Be as detailed as possible. An admin will review your claim.
                </p>
                <form onsubmit="submitClaim(event)">
                    <input type="hidden" id="claim-item-id">
                    <div class="form-group">
                        <label>Proof of Ownership *</label>
                        <textarea id="claim-proof" rows="4" placeholder="Describe details only the owner would know: serial number, engravings, stickers, where you bought it, when you lost it, etc." required></textarea>
                    </div>
                    <div class="modal-footer" style="padding:0; border:none; margin-top:16px;">
                        <button type="button" class="btn btn-secondary" onclick="closeModal('claim-modal')">Cancel</button>
                        <button type="submit" class="btn btn-success" style="width:auto;">Submit Claim</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Chat Modal -->
    <div id="chat-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="chat-title">Messages</h3>
                <button class="modal-close" onclick="closeModal('chat-modal')">&times;</button>
            </div>
            <div class="modal-body" style="padding:0;">
                <div class="chat-container">
                    <div class="chat-messages" id="chat-messages"></div>
                    <div class="chat-input">
                        <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMessage()">
                        <button class="btn btn-primary btn-sm" onclick="sendMessage()" style="width:auto;">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="js/dashboard.js"></script>
</body>
</html>
