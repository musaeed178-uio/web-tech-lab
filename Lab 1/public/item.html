<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Details - COMSATS Lost & Found</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            COMSATS Lost & Found
        </div>
        <div class="nav-links">
            <span class="nav-user" id="user-display"></span>
            <button class="btn-icon" onclick="toggleTheme()" title="Toggle theme">
                <span id="theme-icon">&#9790;</span>
            </button>
            <a href="/dashboard" class="btn btn-sm btn-secondary">Dashboard</a>
            <a href="/" class="btn btn-sm btn-secondary" onclick="handleLogout()">Sign Out</a>
        </div>
    </nav>

    <div class="main-content">
        <div style="margin-bottom:16px;">
            <a href="/dashboard" style="font-size:14px;">&larr; Back to Dashboard</a>
        </div>

        <div class="item-detail">
            <div class="item-detail-main">
                <div class="card">
                    <div class="card-header">
                        <h2 id="item-title">Loading...</h2>
                        <span id="item-badge"></span>
                    </div>
                    <div id="item-details"></div>

                    <div style="margin-top:20px; padding-top:16px; border-top:1px solid var(--border);">
                        <div id="item-actions"></div>
                    </div>
                </div>
            </div>

            <div class="item-detail-sidebar">
                <div class="card">
                    <div class="card-header">
                        <h2>Claims</h2>
                    </div>
                    <div id="claims-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Claim Modal -->
    <div id="claim-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Claim This Item</h3>
                <button class="modal-close" onclick="closeModal('claim-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <p style="font-size:14px; color:var(--text-secondary); margin-bottom:16px;">
                    Provide proof of ownership. Be as detailed as possible. An admin will review your claim before contact information is shared.
                </p>
                <form onsubmit="submitClaim(event)">
                    <input type="hidden" id="claim-item-id">
                    <div class="form-group">
                        <label>Proof of Ownership *</label>
                        <textarea id="claim-proof" rows="5" placeholder="Describe details only the owner would know: serial number, unique markings, stickers, color details, where/when you lost it, etc." required></textarea>
                    </div>
                    <div class="modal-footer" style="padding:0; border:none; margin-top:16px;">
                        <button type="button" class="btn btn-secondary" onclick="closeModal('claim-modal')">Cancel</button>
                        <button type="submit" class="btn btn-success" style="width:auto;">Submit Claim</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Chat Modal -->
    <div id="chat-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="chat-title">Messages</h3>
                <button class="modal-close" onclick="closeModal('chat-modal')">&times;</button>
            </div>
            <div class="modal-body" style="padding:0;">
                <div id="contact-info" style="padding:12px 16px; background:var(--bg-tertiary); font-size:13px; display:none;"></div>
                <div class="chat-container" style="border:none; border-radius:0;">
                    <div class="chat-messages" id="chat-messages"></div>
                    <div class="chat-input">
                        <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMessage()">
                        <button class="btn btn-primary btn-sm" onclick="sendMessage()" style="width:auto;">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="js/item.js"></script>
</body>
</html>
